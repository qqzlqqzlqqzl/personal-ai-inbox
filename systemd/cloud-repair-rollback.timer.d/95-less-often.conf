# 2026-11-12: every 20s produced ~8,400 journal lines a day (31% of the user
# journal) for a check that is almost always "clean". A killed repair tick is
# already compensated by cloud-recovery.service ExecStopPost, and OnBootSec
# still covers reboots. Remove this file to restore the 20s cadence.
[Timer]
OnUnitInactiveSec=
OnUnitInactiveSec=5min
