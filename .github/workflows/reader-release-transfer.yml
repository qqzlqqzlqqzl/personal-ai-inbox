name: Package verified Reader release
on:
  push:
    branches: [ops/reader-release-transfer]
permissions:
  contents: read
jobs:
  release-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 24877e12ce182c4b612a2659c7d8c3712845dd60
          fetch-depth: 0
          persist-credentials: false
      - name: Bundle only verified release changes since production
        run: |
          set -eu
          base=8f1f4870d7ec403f0c0660cee310eaf215ea46cd
          target=24877e12ce182c4b612a2659c7d8c3712845dd60
          test "$(git rev-parse HEAD)" = "$target"
          git merge-base --is-ancestor "$base" "$target"
          mkdir -p transfer
          git bundle create transfer/reader-ui-release.bundle HEAD "^$base"
          git bundle verify transfer/reader-ui-release.bundle
          git bundle list-heads transfer/reader-ui-release.bundle > transfer/bundle-heads.txt
          git diff --stat "$base" "$target" > transfer/changed-files.txt
          printf 'base=%s\ntarget=%s\ntree=%s\n' "$base" "$target" "$(git rev-parse HEAD^{tree})" > transfer/manifest.txt
          sha256sum transfer/reader-ui-release.bundle >> transfer/manifest.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reader-verified-release-24877e12
          path: transfer/
          retention-days: 7
