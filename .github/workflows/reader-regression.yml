name: Reader regression

on:
  pull_request:
  push:
    branches: [main, codex/kaggle-qwen36-batches]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.dev.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements.dev.lock.txt
          npm install --global --ignore-scripts pnpm@11.21.0
      - name: Fetch exact public reader source
        run: |
          git clone --filter=blob:none https://github.com/electh/ReactFlux.git upstream/reactflux
          git -C upstream/reactflux checkout 534eeb97723ac11025de4ec1ac56335072e3be52
          python tests/build_ci_reader.py --prepare-only
          pnpm --dir upstream/reactflux install --frozen-lockfile --ignore-scripts
          npm install --prefix runtime/history-test-tools --ignore-scripts jsdom@26.1.0
      - name: Full isolated Python regression
        env:
          PYTHONPATH: src:src/kaggle_batch
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          import initialize_secrets, pytest
          initialize_secrets.ROOT = Path.cwd()
          raise SystemExit(pytest.main(['-q', 'tests', 'src/kaggle_batch', '--ignore=src/kaggle_batch/test-runs', '--junitxml=artifacts/ci-python.xml']))
          PY
      - name: JavaScript and component lifecycle regression
        run: |
          for test in tests/test_*.mjs; do node "$test"; done
          node tests/source_history_component_acceptance.mjs
      - name: Build isolated reader
        run: python tests/build_ci_reader.py
      - name: Install hosted Chromium
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Desktop and mobile viewport UI regression
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/history_browser_acceptance.py
      - name: Reviewed control workflows in isolated Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/review_console_browser.py
      - name: Reading recovery and navigation in isolated Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/review_reading_browser.py
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-regression-${{ github.run_id }}
          path: |
            artifacts/ci-python.xml
            artifacts/review-overlay-input/
            runtime/browser-acceptance.json
            runtime/history-*.png
            runtime/quota-*.png
            runtime/browser-failure.png
            runtime/review-console/
            runtime/review-reading/
          retention-days: 7
