name: Reader regression

on:
  pull_request:
  push:
    branches: [main, codex/kaggle-qwen36-batches]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.dev.lock.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - name: Install locked test dependencies
        run: |
          python -m pip install -r requirements.dev.lock.txt
          npm install --global --ignore-scripts pnpm@11.21.0
      - name: Fetch exact public reader source
        run: |
          git clone --filter=blob:none https://github.com/electh/ReactFlux.git upstream/reactflux
          git -C upstream/reactflux checkout 534eeb97723ac11025de4ec1ac56335072e3be52
          python tests/build_ci_reader.py --prepare-only
          pnpm --dir upstream/reactflux install --frozen-lockfile --ignore-scripts
          npm install --prefix runtime/history-test-tools --ignore-scripts jsdom@26.1.0
      - name: Full isolated Python regression
        env:
          PYTHONPATH: src:src/kaggle_batch
        run: |
          mkdir -p artifacts
          python - <<'PY'
          from pathlib import Path
          import initialize_secrets, pytest
          initialize_secrets.ROOT = Path.cwd()
          raise SystemExit(pytest.main(['-q', 'tests', 'src/kaggle_batch', '--ignore=src/kaggle_batch/test-runs', '--junitxml=artifacts/ci-python.xml']))
          PY
      - name: JavaScript and component lifecycle regression
        run: |
          for test in tests/test_*.mjs; do node "$test"; done
          node tests/source_history_component_acceptance.mjs
      - name: Build isolated reader
        run: python tests/build_ci_reader.py
      - name: Install Chromium system dependencies
        run: python -m playwright install-deps chromium
      - name: Install hosted Chromium headless shell
        # The browser tests launch headless Chromium without a channel override.
        run: python -m playwright install --only-shell chromium
      - name: Resolve CJK font from refreshed APT indices
        id: cjk-package
        # install-deps above refreshes signed APT indices; never cache this manifest.
        run: python tests/ci_cjk_font.py prepare --cache "$RUNNER_TEMP/reader-cjk-deb" --manifest "$RUNNER_TEMP/reader-cjk-package.json"
      - name: Restore exact CJK font archive
        id: cjk-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: 1
        with:
          path: ${{ runner.temp }}/reader-cjk-deb
          key: ${{ steps.cjk-package.outputs.key }}
      - name: Install CJK fonts for browser evidence
        # Cache hits are untrusted: check every entry, size and SHA256 before sudo.
        run: python tests/ci_cjk_font.py install --cache "$RUNNER_TEMP/reader-cjk-deb" --manifest "$RUNNER_TEMP/reader-cjk-package.json"
      - name: Verify rendered Chinese glyph fonts
        run: python tests/cjk_font_browser_acceptance.py
      - name: Desktop and mobile viewport UI regression
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/history_browser_acceptance.py
      - name: Reviewed control workflows in isolated Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/review_console_browser.py
      - name: Reading recovery and navigation in isolated Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/review_reading_browser.py
      - name: Search IME and cancel regression in isolated Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/search_ime_browser_audit.py
      - name: Sort order and persistence in isolated Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/sort_browser_acceptance.py
      - name: Account calendar consistency across three browser timezones
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/calendar_browser_acceptance.py
      - name: Invalid and failed account timezone recovery in Chromium
        env:
          AI_NEWS_TEST_BUILD: runtime/browser-build
        run: python tests/calendar_identity_browser.py
      - name: Save verified CJK font archive after full regression
        if: steps.cjk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/reader-cjk-deb
          key: ${{ steps.cjk-package.outputs.key }}
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-regression-${{ github.run_id }}
          path: |
            artifacts/ci-python.xml
            artifacts/review-overlay-input/
            runtime/browser-acceptance.json
            runtime/history-*.png
            runtime/quota-*.png
            runtime/browser-failure.png
            runtime/cjk-font/
            runtime/review-console/
            runtime/review-reading/
            runtime/search-ime-*/
            runtime/sort-*/
            runtime/sort-component.json
            runtime/calendar-*/
            runtime/browser-build/
          retention-days: 7
