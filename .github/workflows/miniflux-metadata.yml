name: Miniflux metadata compatibility

on:
  pull_request:
    paths:
      - 'ops/miniflux-metadata/**'
      - 'src/api.py'
      - 'src/notes_metadata.py'
      - 'tests/test_notes_metadata.py'
      - '.github/workflows/miniflux-metadata.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miniflux-metadata-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        # Official postgres 17.11 multi-platform index; recorded in pins.json.
        image: postgres@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: issue73
          POSTGRES_PASSWORD: issue73-disposable-only
          POSTGRES_DB: issue73_metadata_test
        ports:
          - 55473:5432
        options: >-
          --health-cmd "pg_isready -U issue73 -d issue73_metadata_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # Synthetic credentials for this ephemeral service only; no repository secrets.
      ISSUE73_POSTGRES_URL: postgres://issue73:issue73-disposable-only@127.0.0.1:55473/issue73_metadata_test?sslmode=disable
      ISSUE73_DISPOSABLE_POSTGRES: '1'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # reviewed repository pin
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify package and fetch exact official upstream
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s ops/miniflux-metadata/scripts -p test_verify.py -v
          python3 ops/miniflux-metadata/scripts/verify.py package
          python3 ops/miniflux-metadata/scripts/verify.py fetch "$RUNNER_TEMP/issue73-miniflux"
          python3 ops/miniflux-metadata/scripts/verify.py apply "$RUNNER_TEMP/issue73-miniflux"
      - name: Install checksum-pinned official Go toolchain
        shell: bash
        run: |
          set -euo pipefail
          bash ops/miniflux-metadata/scripts/bootstrap-go.sh "$RUNNER_TEMP/issue73-go"
          echo "$RUNNER_TEMP/issue73-go/go/bin" >> "$GITHUB_PATH"
      - name: Compile and run upstream, protocol, failure and real PostgreSQL auth tests
        shell: bash
        run: bash ops/miniflux-metadata/scripts/test.sh "$RUNNER_TEMP/issue73-miniflux" "$RUNNER_TEMP/issue73-evidence"
      - name: Upload fixture-only verification evidence and candidate binary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: miniflux-metadata-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/issue73-evidence/
          if-no-files-found: warn
          retention-days: 7
